titulo: Budín de limón y amapolas
tipo: dulce
veggie: true
tiempo_min: 70
dificultad: Fácil
porciones: 4
unidad: budines chicos
fotos: [original.jpg]
nota: "Proporción: 1 cdita. de Royal por cada taza de harina."
ingredientes:
  - items:
      - 4 huevos
      - 1/2 taza de aceite
      - 1/2 taza de crema de leche
      - 1 cdita. de esencia de vainilla
      - 2 tazas de azúcar
      - 3 tazas de harina 0000
      - 3 cditas. de polvo de hornear (Royal)
      - 1 cdita. de bicarbonato
      - 1 cdita. de sal
      - Ralladura de 2 limones
      - 50 g de semillas de amapola
  - grupo: Almíbar
    items:
      - Jugo de 2 limones
      - 1/2 taza de azúcar
pasos:
  - items:
      - Batir los huevos con el azúcar y la esencia de vainilla. Agregar la crema y el aceite.
      - En un bowl, poner la harina, el Royal, la sal y el bicarbonato, y agregar la ralladura de limón.
      - Agregar las amapolas y combinar todo.
      - Hornear a 180 °C unos 35–45 minutos, hasta que un palillo salga seco. [estimado]
      - Mezclar el jugo de los dos limones con la media taza de azúcar y llevar a fuego lento hasta que hierva. Echarlo sobre el budín cuando esté listo.
      - Opcional, glasé de azúcar impalpable + limón por arriba.
