titulo: Calabaza rellena
tipo: salado
veggie: true
tiempo_min: 80
dificultad: Fácil
porciones: 2
unidad: porciones
nota: Las verduras son a gusto, vale cualquiera que tengas.
ingredientes:
  - items:
      - 1 zapallo anco grande o 1 calabaza redonda mediana
      - 1 cebolla [estimado]
      - 1/2 morrón [estimado]
      - 150 g de hongos [estimado]
      - 1/2 brócoli, en ramitos [estimado]
      - 1 lata de choclo, escurrido
      - 150 g de muzzarella, en pedazos [estimado]
      - 40 g de parmesano rallado [estimado]
      - Aceite, sal y pimienta
pasos:
  - items:
      - Precalentar el horno a 200 °C. Si es anco, cortarlo a la mitad a lo largo y sacarle las semillas. Si es redonda, cortarle solo la tapa y vaciar las semillas. [estimado]
      - Pincelar con aceite, salar y hornear hasta que esté tierna, unos 40–50 minutos el anco y 60–75 minutos la redonda. [estimado]
      - Mientras tanto, saltear en una sartén con aceite la cebolla, el morrón, los hongos, el brócoli o las verduras que tengas. Agregar el choclo al final.
      - Cuando la calabaza esté cocida, sacarle la pulpa con una cuchara, dejando una pared de 1 cm para que no se rompa.
      - Mezclar la pulpa con las verduras salteadas y salpimentar.
      - Volver a rellenar la calabaza, metiendo pedazos de muzzarella entre el relleno. Cubrir con parmesano.
      - Volver al horno unos 10–15 minutos, hasta que se dore arriba. [estimado]
