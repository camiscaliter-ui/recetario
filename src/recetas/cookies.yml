titulo: Cookies
tipo: dulce
veggie: true
tiempo_min: 25
tiempo_nota: 15 min de preparación + 10 min de horno
dificultad: Fácil
porciones: 20
unidad: unidades
fotos: [original.jpg]
ingredientes:
  - items:
      - 200 g de manteca
      - 1 huevo
      - 3/4 taza de azúcar blanca
      - 3/4 taza de azúcar negra
      - 1 cdita. de esencia de vainilla
      - 2 y 1/4 tazas de harina leudante (o harina 0000 + 1 cdita. de Royal)
      - 1/2 cdita. de sal
      - Chips de chocolate o chocolate en pedacitos
pasos:
  - items:
      - En un bol, poner la manteca, el huevo, los dos azúcares y la esencia de vainilla, y mezclar.
      - Agregar la harina y la sal, y mezclar. ¡No mezclar con la mano!
      - Agregar los chips de chocolate.
      - Hacer bollitos y colocarlos en una bandeja.
      - Hornear a 150 °C (horno medio) unos 10 minutos. ¡Lo importante es el color de abajo!
