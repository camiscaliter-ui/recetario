titulo: Milanesas al horno
tipo: salado
veggie: false
tiempo_min: 80
tiempo_nota: 20 min de preparación + mínimo 30 min de heladera + horno
dificultad: Media
porciones: 5
unidad: porciones
ingredientes:
  - items:
      - 1 kg de carne para milanesa
      - 4 o 5 huevos
      - 2 dientes de ajo, picados
      - 2 o 3 cdas. de mostaza
      - Sal
      - 1 puñado de perejil
      - 2 cdas. de leche (opcional)
      - Pan rallado, el necesario
      - Aceite
pasos:
  - items:
      - Preparar la carne. Sacarle la grasita si tiene y, si está gruesa, darle unos golpecitos.
      - Batir los huevos y agregar el ajo, la mostaza, el perejil y sal. Batir bien. Si querés la mezcla más fluida, sumar 2 cdas. de leche.
      - Poner la carne en la mezcla, mezclar, tapar y llevar a la heladera al menos 30 minutos (puede ser más, incluso horas).
      - Empanar haciendo presión para que el pan rallado se pegue bien. Ir agregando pan rallado a medida que haga falta, porque el que sobra se tira.
      - Volver a llevar a la heladera las milanesas ya empanadas.
      - Precalentar el horno a 200–220 °C durante al menos 10 minutos. Nunca ponerlas con el horno tibio.
      - Con el horno bien caliente, meter la asadera sola con un poco de aceite durante 1 minuto.
      - Sacarla con cuidado y colocar las milanesas; al contacto con el aceite caliente se sellan. Se les puede poner un poco de aceite por encima o rociarlas con aceite en spray.
      - Cocinar 7 minutos de cada lado, siempre con el horno bien precalentado.
